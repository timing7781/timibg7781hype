<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Монитор учебной группы</title>
    <style>
        :root {
            --primary-color: #007bff;
            --danger-color: #dc3545;
            --success-color: #28a745;
            --bg-color: #f4f7f9;
        }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg-color); display: flex; flex-direction: column; align-items: center; padding: 20px; color: #333; }
        
        .card { background: white; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.06); width: 100%; max-width: 550px; margin-bottom: 20px; box-sizing: border-box; }
        h2 { margin-top: 0; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        
        .status-info-box { background: #eef6ff; border-radius: 12px; padding: 16px; margin-bottom: 20px; border-left: 4px solid var(--primary-color); }
        .info-row { display: flex; align-items: center; gap: 10px; font-size: 0.9rem; margin: 4px 0; }
        .info-row b { color: var(--primary-color); }

        .timer-box { background: #f8f9fa; border-radius: 10px; padding: 15px; text-align: center; margin-bottom: 20px; border: 1px dashed #ccc; }
        #timerDisplay { font-size: 1.8rem; font-weight: bold; color: var(--primary-color); font-family: monospace; }
        .btn-session { margin-top: 10px; padding: 8px 20px; border-radius: 20px; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-start { background: var(--success-color); color: white; }
        .btn-stop { background: var(--danger-color); color: white; }

        .status-grid { display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0 25px 0; }
        .status-option { 
            padding: 8px 16px; border: 1px solid #dee2e6; border-radius: 20px; background: white;
            cursor: pointer; font-size: 0.9rem; transition: all 0.2s ease; display: flex; align-items: center; gap: 6px;
        }
        .status-option:hover { border-color: var(--primary-color); background: #f8faff; }
        .status-option.active { background: var(--primary-color); color: white; border-color: var(--primary-color); }

        .btn-save { width: 100%; padding: 12px; background: var(--primary-color); color: white; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; }

        /* ИНДИКАТОР ОНЛАЙНА */
        .user-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid #f1f3f5; }
        .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #ccc; margin-right: 15px; transition: 0.3s; }
        .online-dot.active { background: var(--success-color); box-shadow: 0 0 8px var(--success-color); }
        
        .username { font-weight: 600; flex-grow: 1; }
        .user-meta { text-align: right; }
        .status-tag { font-size: 0.75rem; color: #6c757d; background: #f8f9fa; padding: 4px 10px; border-radius: 10px; border: 1px solid #eee; }
        .session-tag { display: block; font-size: 0.7rem; color: var(--primary-color); margin-top: 2px; font-weight: bold; }

        #chatBox { height: 180px; overflow-y: auto; background: #fdfdfd; border: 1px solid #eee; padding: 12px; border-radius: 10px; margin-bottom: 10px; font-size: 0.9rem; display: flex; flex-direction: column; gap: 8px; }
        .chat-msg { padding: 6px 12px; background: #f0f7ff; border-radius: 8px; align-self: flex-start; max-width: 85%; }
        .chat-msg b { color: var(--primary-color); font-size: 0.75rem; display: block; }
        .chat-input-container { display: flex; gap: 8px; }
        #chatInput { flex-grow: 1; padding: 10px; border-radius: 8px; border: 1px solid #ddd; outline: none; }
        .btn-send { padding: 10px 18px; background: var(--success-color); color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="card">
        <h2>👤 Мой профиль</h2>
        <div class="status-info-box">
            <div id="authContent">Загрузка...</div>
        </div>
        <div id="sessionUI" style="display:none;">
            <div class="timer-box">
                <div id="timerDisplay">00:00:00</div>
                <button id="toggleSessionBtn" class="btn-session btn-start">▶ Начать учебу</button>
            </div>
        </div>
        <div class="status-grid" id="statusPicker">
            <div class="status-option" onclick="prepStatus(this, '🟢 Онлайн')">🟢 Онлайн</div>
            <div class="status-option" onclick="prepStatus(this, '☕ Отошёл')">☕ Отошёл</div>
            <div class="status-option" onclick="prepStatus(this, '🔴 Не беспокоить')">🔴 Не беспокоить</div>
            <div class="status-option" onclick="prepStatus(this, '🗓️ Встреча')">🗓️ Встреча</div>
        </div>
        <button class="btn-save" onclick="applyStatus()">Обновить статус</button>
    </div>

    <div class="card">
        <h2>👥 Монитор группы</h2>
        <div id="groupList"></div>
    </div>

    <div class="card" id="chatSection" style="display:none;">
        <h2>💬 Общий чат</h2>
        <div id="chatBox"></div>
        <div class="chat-input-container">
            <input type="text" id="chatInput" placeholder="Сообщение...">
            <button class="btn-send" onclick="window.sendMessage()">➡</button>
        </div>
    </div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

    const URL = 'https://rgyuyvoiovrwnrjgrnbm.supabase.co'; 
    const KEY = 'sb_publishable_HTaSDRoIFtfeisZ_08lS0g_bFp0Zlju'; 
    const supabase = createClient(URL, KEY);
    
    let currentUser = null;
    let tempStatus = { text: '' };

    async function checkUser() {
        const { data } = await supabase.auth.getUser();
        if (data?.user) {
            currentUser = data.user;
            document.getElementById('sessionUI').style.display = 'block';
            document.getElementById('chatSection').style.display = 'block'; 
            
            document.querySelector('.status-info-box').innerHTML = `
                <div class="info-row">👨‍💻 Пользователь: <b>${currentUser.user_metadata.full_name || currentUser.email}</b></div>
                <div class="info-row">📌 Статус: <span id="currentStatusText">...</span></div>
            `;

            await supabase.from('profiles').upsert({ id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email });

            fetchGroup();
            fetchMessages(); 
            // Мгновенный запуск и интервал для индикатора присутствия
            updateHeartbeat();
            setInterval(updateHeartbeat, 30000);
        } else {
            document.querySelector('.status-info-box').innerHTML = `<button id="loginBtn">Войти через Google</button>`;
            document.getElementById('loginBtn').onclick = () => supabase.auth.signInWithOAuth({ provider: 'google' });
        }
    }

    async function updateHeartbeat() {
        if (currentUser) {
            await supabase.from('profiles').update({ last_seen: new Date().toISOString() }).eq('id', currentUser.id);
        }
    }

    window.prepStatus = (element, text) => {
        document.querySelectorAll('.status-option').forEach(opt => opt.classList.remove('active'));
        element.classList.add('active');
        tempStatus.text = text;
    };

    window.applyStatus = async () => {
        if (!currentUser || !tempStatus.text) return;
        await supabase.from('profiles').update({ status: tempStatus.text }).eq('id', currentUser.id);
        fetchGroup();
    };

    async function fetchGroup() {
        const { data } = await supabase.from('profiles').select('*').order('username', { ascending: true });
        if (!data) return;
        
        document.getElementById('groupList').innerHTML = data.map(user => {
            // ЛОГИКА ИНДИКАТОРА: Если активность была менее 60 секунд назад
            const isOnline = user.last_seen && (new Date() - new Date(user.last_seen) < 60000);
            
            return `
                <div class="user-item">
                    <div class="online-dot ${isOnline ? 'active' : ''}"></div>
                    <div class="username">${user.username}</div>
                    <div class="user-meta">
                        <div class="status-tag">${user.status || 'В сети'}</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    window.sendMessage = async () => {
        const input = document.getElementById('chatInput');
        if (!input.value.trim()) return;
        await supabase.from('messages').insert({ user_id: currentUser.id, username: currentUser.user_metadata.full_name || currentUser.email, text: input.value });
        input.value = '';
        fetchMessages();
    };

    async function fetchMessages() {
        const { data } = await supabase.from('messages').select('*').order('created_at', { ascending: false }).limit(15);
        if (data) {
            document.getElementById('chatBox').innerHTML = data.reverse().map(m => `
                <div class="chat-msg"><b>${m.username}:</b> ${m.text}</div>
            `).join('');
        }
    }

    checkUser();
    setInterval(fetchGroup, 5000); // Обновление списка группы каждые 5 сек
</script>
</body>
</html>
